name: Duo and Trio moderation
on:
  push:
    branches: [main, fix/database-build, fix/startup]
  pull_request:
    paths:
      - 'artifacts/api-server/src/**'
      - 'artifacts/api-server/tests/**'
      - 'lib/db/**'
      - 'nixpacks.toml'
      - 'package.json'
      - 'rust-plugins/GuerraFriaModeration.cs'
      - 'artifacts/api-server/assets/**'
      - '.github/workflows/moderation-parity.yml'
permissions:
  contents: read
jobs:
  moderation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: guerra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guerra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Nixpacks Node plan despite C# plugin tests
        run: |
          curl -fsSL https://github.com/railwayapp/nixpacks/releases/download/v1.41.0/nixpacks-v1.41.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/nixpacks.tar.gz
          mkdir -p /tmp/gf-nixpacks
          tar -xzf /tmp/nixpacks.tar.gz -C /tmp/gf-nixpacks
          /tmp/gf-nixpacks/nixpacks plan . --format json > /tmp/gf-build-plan.json
          python3 - <<'PYTHON'
          import json
          plan=json.load(open('/tmp/gf-build-plan.json'))
          setup=json.dumps(plan['phases']['setup'])
          install=' '.join(plan['phases']['install']['cmds'])
          assert 'nodejs_22' in setup, setup
          assert 'dotnet' not in setup, setup
          assert 'pnpm-10_x' in setup or '10.11.0' in install, (setup, install)
          assert '--prod=false' in install, install
          print('Nixpacks selects Node 22 and pnpm 10; development dependencies included')
          PYTHON
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile database package (Coolify build step)
        run: pnpm tsc -p lib/db/tsconfig.json
      - run: node --test tests/*.test.mjs
        working-directory: artifacts/api-server
      - name: Build API (Coolify build step)
        run: pnpm --filter @workspace/api-server run build
      - name: Initialize isolated test database
        run: node lib/db/init-db.mjs
        env:
          DATABASE_URL: postgresql://postgres:test-password@localhost:5432/guerra_test
      - name: Start built application and check HTTP health
        run: node artifacts/api-server/scripts/startup-smoke.mjs
        env:
          DATABASE_URL: postgresql://postgres:test-password@localhost:5432/guerra_test
      - name: Start built application with development logging
        run: node artifacts/api-server/scripts/startup-smoke.mjs
        env:
          DATABASE_URL: postgresql://postgres:test-password@localhost:5432/guerra_test
          NODE_ENV: development

  rust-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check plugin protocol, persistence and IP enforcement
        run: dotnet run --project artifacts/api-server/tests/plugin-runtime/PluginTests.csproj

      - name: Check leaderboard plugin wipe identity and event protocol
        run: dotnet run --project artifacts/api-server/tests/leaderboard-plugin-runtime/LeaderboardTests.csproj
      - name: Generate server-specific plugin packages
        run: python3 scripts/package-rust-competitive.py --output /tmp/gf-plugins
      - name: Compile and check Duo leaderboard package
        run: dotnet run --project artifacts/api-server/tests/leaderboard-plugin-runtime/LeaderboardTests.csproj -p:LeaderboardSource=/tmp/gf-plugins/Duo/GuerraFriaLeaderboard.cs
      - name: Compile and check Trio leaderboard package
        run: dotnet run --project artifacts/api-server/tests/leaderboard-plugin-runtime/LeaderboardTests.csproj -p:LeaderboardSource=/tmp/gf-plugins/Trio/GuerraFriaLeaderboard.cs
