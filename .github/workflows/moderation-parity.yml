name: Duo and Trio moderation
on:
  push:
    branches: [main, fix/database-build]
  pull_request:
    paths:
      - 'artifacts/api-server/src/**'
      - 'artifacts/api-server/tests/**'
      - 'lib/db/**'
      - '.github/workflows/moderation-parity.yml'
permissions:
  contents: read
jobs:
  moderation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile database package (Coolify build step)
        run: pnpm tsc -p lib/db/tsconfig.json
      - run: node --test tests/moderation-parity.test.mjs tests/liveops-servers.test.mjs tests/trio-rcon.test.mjs tests/unban-integration.test.mjs tests/ban-panel.test.mjs tests/menu-unban.test.mjs
        working-directory: artifacts/api-server
      - name: Build API (Coolify build step)
        run: pnpm --filter @workspace/api-server run build
